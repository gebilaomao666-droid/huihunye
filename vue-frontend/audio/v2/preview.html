<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回魂夜 音效试听</title>
<style>
:root{
  --bg:#f3efe6; --panel:#fbf8f1; --ink:#2a2420; --muted:#7a6f64; --line:#e0d8ca;
  --accent:#9e2b25; --accent-soft:#f1dcd6; --chip:#ece5d8; --bar:#c9bfae;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141211; --panel:#1c1917; --ink:#e9e2d6; --muted:#9a8f82; --line:#2e2925;
    --accent:#d0574d; --accent-soft:#3a201d; --chip:#272220; --bar:#4a423b;
  }
}
:root[data-theme="dark"]{
  --bg:#141211; --panel:#1c1917; --ink:#e9e2d6; --muted:#9a8f82; --line:#2e2925;
  --accent:#d0574d; --accent-soft:#3a201d; --chip:#272220; --bar:#4a423b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Serif SC","Songti SC","SimSun",serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:system-ui,sans-serif;font-size:13px}
.ctrl input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.ctrl label{display:inline-flex;gap:5px;align-items:center;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:5px 10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
button.stop{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-family:system-ui,sans-serif;font-size:12px}
nav a{color:var(--muted);text-decoration:none;background:var(--chip);padding:3px 9px;border-radius:99px}
main{padding:6px 16px 60px}
section h2{font-size:17px;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);letter-spacing:.06em}
section h2 small{color:var(--muted);font-weight:normal;font-size:12px;font-family:system-ui,sans-serif;margin-left:6px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0}
.row.room{margin-left:26px;opacity:.92}
.row.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.play{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:14px;display:grid;place-items:center}
.row.playing .play{background:var(--accent);color:#fff}
.name{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
.purpose{margin:1px 0 3px}
.meta{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta a{color:var(--muted)}
.chip{background:var(--chip);border-radius:4px;padding:0 6px}
.chip.loop{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--accent);margin-top:2px;font-family:system-ui,sans-serif}
.dur{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.prog{grid-column:2 / 4;height:3px;background:var(--line);border-radius:2px;overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.hide{display:none}
@media (max-width:600px){ .row{grid-template-columns:40px 1fr} .dur{grid-column:2;text-align:left} .row.room{margin-left:12px} }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>回魂夜 · 音效与配乐试听</h1>
  <p class="sub">游戏内副本（vue-frontend/audio/v2，只含游戏实际用到的 63 条，完整素材库见 audio_v2/preview.html） · 全部来自真实录音加工 · 点圆钮播放，再点停止；循环类素材可勾“循环试听”检查接缝</p>

    <button class="stop" id="stopall">全部停止</button>
  </div>
  <nav id="nav"></nav>
</div></header>

let fmt = 'ogg', cur = null;
const audio = new Audio(); audio.preload = 'none';
const list = document.getElementById('list'), nav = document.getElementById('nav');
const fmtSec = s => s >= 60 ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : `${s.toFixed(1)}s`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
for (const [key, label] of DATA.cats) {
  const rows = DATA.rows.filter(r => r.g === key);
  if (!rows.length) continue;
  const sec = document.createElement('section'); sec.id = 'g-' + key.replace(':','-');
  sec.innerHTML = `<h2>${label}<small>${rows.filter(r=>!r.room).length} 条${rows.some(r=>r.room)?' + 混响版':''}</small></h2>`;
  for (const r of rows) {
    const d = document.createElement('div'); d.className = 'row' + (r.room ? ' room' : ''); d.dataset.id = r.id;
    d.dataset.text = (r.id + ' ' + r.p).toLowerCase();
    const srcs = r.src.map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t.length>46?s.t.slice(0,44)+'…':s.t)}</a>`).join('、');
    d.innerHTML = `<button class="play" aria-label="播放 ${esc(r.id)}">▶</button>
      <div><div class="name">${esc(r.id)}</div><div class="purpose">${esc(r.p)}</div>
      <div class="meta">${r.loop?'<span class="chip loop">循环</span>':''}<span class="chip">${esc(r.lic)}</span><span>${esc(r.au)}</span><span>${r.i} LUFS · 峰值 ${r.pk} dBFS</span><span>来源：${srcs}</span></div>
      ${r.note?`<div class="note">注：${esc(r.note)}</div>`:''}</div>
      <div class="dur">${fmtSec(r.d)}</div><div class="prog"><i></i></div>`;
    d.querySelector('.play').onclick = () => toggle(r, d);
    d.querySelector('.prog').onclick = ev => { if (cur && cur.d === d && audio.duration) { const b = ev.currentTarget.getBoundingClientRect(); audio.currentTime = (ev.clientX - b.left) / b.width * audio.duration; } };
    sec.appendChild(d);
  }
  list.appendChild(sec);
  const a = document.createElement('a'); a.href = '#' + sec.id; a.textContent = label; nav.appendChild(a);
}
function stop() { audio.pause(); if (cur) { cur.d.classList.remove('playing'); cur.d.querySelector('.play').textContent = '▶'; cur.d.querySelector('.prog i').style.width = 0; } cur = null; }
function toggle(r, d) {
  if (cur && cur.d === d) { stop(); return; }
  stop();
  audio.src = r[fmt]; audio.loop = r.loop && document.getElementById('loopchk').checked;
  audio.volume = +document.getElementById('vol').value;
  audio.play().catch(e => { d.querySelector('.note')?.remove(); d.children[1].insertAdjacentHTML('beforeend', `<div class="note">无法播放：${esc(e.message)}</div>`); });
  cur = { r, d }; d.classList.add('playing'); d.querySelector('.play').textContent = '■';
}
audio.onended = stop;
audio.ontimeupdate = () => { if (cur && audio.duration) cur.d.querySelector('.prog i').style.width = (audio.currentTime / audio.duration * 100) + '%'; };
document.getElementById('stopall').onclick = stop;
document.getElementById('vol').oninput = e => audio.volume = +e.target.value;
document.getElementById('loopchk').onchange = e => { if (cur) audio.loop = cur.r.loop && e.target.checked; };
document.querySelectorAll('#fmt button').forEach(b => b.onclick = () => { document.querySelectorAll('#fmt button').forEach(x => x.classList.toggle('on', x === b)); fmt = b.dataset.f; stop(); });
function filter() {
  const q = document.getElementById('q').value.trim().toLowerCase(), room = document.getElementById('roomchk').checked;
  document.querySelectorAll('.row').forEach(d => { const r = DATA.rows.find(x => x.id === d.dataset.id); d.classList.toggle('hide', (q && !d.dataset.text.includes(q)) || (!room && r.room)); });
  document.querySelectorAll('section').forEach(s => s.classList.toggle('hide', !s.querySelector('.row:not(.hide)')));
}
document.getElementById('q').oninput = filter; document.getElementById('roomchk').onchange = filter;
document.addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });
</script>
